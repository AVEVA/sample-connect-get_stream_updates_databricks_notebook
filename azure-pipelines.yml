variables:
  - group: PRG-dev-automation
  - name: analysisProject
    value: sample-connect-get_stream_updates_databricks_notebook

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 0 * * 0'
    displayName: Weekly build
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: ArchitectureRepo
      type: git
      name: Architecture/Architecture
      ref: refs/heads/main
    - repository: templates
      type: github
      name: AVEVA/pipelines-templates
      endpoint: AVEVA
    - repository: antiMalwareTemplate
      name: Architecture/Architecture 
      ref: refs/heads/antiMalwareVersions/0.1
      type: git

jobs:

  - template: '/code-analysis/code-analysis.yml@templates'
    parameters:
      poolForExecution: Cloud Platform CONNECT v2 Development
      useRequirementsTxt: true
      buildSteps:
        - script: |
            echo "Installing Python dependencies"
            python -c "import sys; print(sys.executable)"
            python -m pip --version
            python -m pip install --upgrade pip
            python -m pip install nbconvert
            python -m pip freeze
          displayName: 'Install Python dependencies'

        # Coverity cannot capture .ipynb files, so export each notebook to a .py source file first.
        - task: PythonScript@0
          displayName: 'Export notebooks to Python sources for Coverity capture'
          inputs:
            scriptSource: 'inline'
            script: |
              import pathlib
              import re
              import nbformat
              from nbconvert import PythonExporter

              root = pathlib.Path.cwd()
              out_dir = root / 'converted-notebooks'
              out_dir.mkdir(exist_ok=True)

              exporter = PythonExporter()
              notebooks = sorted(root.rglob('*.ipynb'))
              if not notebooks:
                  raise SystemExit('No .ipynb files found to export.')

              for notebook in notebooks:
                  if '.ipynb_checkpoints' in notebook.parts or out_dir in notebook.parents:
                      continue
                  source, _ = exporter.from_notebook_node(
                      nbformat.read(notebook, as_version=4)
                  )
                  safe_name = re.sub(r'[^A-Za-z0-9_]+', '_', notebook.stem).strip('_')
                  target = out_dir / f'{safe_name}.py'
                  target.write_text(source, encoding='utf-8')
                  print(f'Exported {notebook} -> {target}')